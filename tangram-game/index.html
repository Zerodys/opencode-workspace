<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>七巧板游戏</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Microsoft YaHei', sans-serif;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            min-height: 100vh;
            overflow: hidden;
        }

        .header {
            background: rgba(255,255,255,0.1);
            backdrop-filter: blur(10px);
            padding: 15px 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid rgba(255,255,255,0.1);
        }

        .header h1 {
            color: #fff;
            font-size: 24px;
        }

        .controls {
            display: flex;
            gap: 10px;
        }

        .btn {
            padding: 8px 20px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 14px;
            transition: all 0.3s;
        }

        .btn-primary {
            background: #4ecca3;
            color: #1a1a2e;
        }

        .btn-primary:hover {
            background: #45b393;
            transform: translateY(-2px);
        }

        .btn-secondary {
            background: #e84545;
            color: #fff;
        }

        .btn-secondary:hover {
            background: #d63838;
        }

        .game-container {
            display: flex;
            height: calc(100vh - 70px);
        }

        .pieces-panel {
            width: 280px;
            background: rgba(255,255,255,0.05);
            padding: 20px;
            border-right: 1px solid rgba(255,255,255,0.1);
            overflow-y: auto;
        }

        .pieces-panel h2 {
            color: #fff;
            margin-bottom: 15px;
            font-size: 18px;
        }

        .piece-item {
            display: inline-block;
            margin: 5px;
            cursor: grab;
            transition: transform 0.2s;
        }

        .piece-item:hover {
            transform: scale(1.1);
        }

        .piece-item:active {
            cursor: grabbing;
        }

        .canvas-area {
            flex: 1;
            position: relative;
            background: 
                linear-gradient(rgba(255,255,255,0.03) 1px, transparent 1px),
                linear-gradient(90deg, rgba(255,255,255,0.03) 1px, transparent 1px);
            background-size: 20px 20px;
        }

        #gameCanvas {
            width: 100%;
            height: 100%;
        }

        .snapped-indicator {
            position: fixed;
            bottom: 20px;
            right: 20px;
            background: #4ecca3;
            color: #1a1a2e;
            padding: 10px 20px;
            border-radius: 5px;
            font-weight: bold;
            opacity: 0;
            transition: opacity 0.3s;
        }

        .collision-indicator {
            position: fixed;
            bottom: 20px;
            right: 20px;
            background: #e84545;
            color: #fff;
            padding: 10px 20px;
            border-radius: 5px;
            font-weight: bold;
            opacity: 0;
            transition: opacity 0.3s;
        }

        .collision-indicator.show {
            opacity: 1;
        }

        .snapped-indicator.show {
            opacity: 1;
        }

        .info {
            color: rgba(255,255,255,0.6);
            font-size: 12px;
            margin-top: 20px;
            line-height: 1.6;
        }
    </style>
</head>
<body>
    <div class="header">
        <h1>🧩 七巧板游戏</h1>
        <div class="controls">
            <button class="btn btn-primary" onclick="resetGame()">重置</button>
            <button class="btn btn-secondary" onclick="clearCanvas()">清空</button>
        </div>
    </div>

    <div class="game-container">
        <div class="pieces-panel">
            <h2>七巧板组件</h2>
            <div id="piecesContainer"></div>
            <div class="info">
                <p>💡 提示：</p>
                <p>• 拖拽左侧组件到画布</p>
                <p>• 组件靠近时会自动吸附</p>
                <p>• 双击组件可旋转</p>
            </div>
        </div>
        <div class="canvas-area">
            <canvas id="gameCanvas"></canvas>
        </div>
    </div>

    <div class="snapped-indicator" id="snappedIndicator">✨ 吸附成功！</div>
    <div class="collision-indicator" id="collisionIndicator">⚠️ 无法重叠放置！</div>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const piecesContainer = document.getElementById('piecesContainer');
        const snappedIndicator = document.getElementById('snappedIndicator');
        const collisionIndicator = document.getElementById('collisionIndicator');

        let pieces = [];
        let selectedPiece = null;
        let offsetX, offsetY;
        let isDragging = false;

        const SNAP_DISTANCE = 15;
        const ROTATION_STEP = 45;

        const tangramPieces = [
            {
                name: '大三角形1',
                color: '#e84545',
                points: [[0, 0], [200, 0], [100, 100]],
                id: 1
            },
            {
                name: '大三角形2',
                color: '#f9d423',
                points: [[0, 0], [200, 0], [100, 100]],
                id: 2
            },
            {
                name: '中三角形',
                color: '#4ecca3',
                points: [[0, 0], [100, 0], [50, 50]],
                id: 3
            },
            {
                name: '小三角形1',
                color: '#00adb5',
                points: [[0, 0], [100, 0], [50, 50]],
                id: 4
            },
            {
                name: '小三角形2',
                color: '#a8d8ea',
                points: [[0, 0], [100, 0], [50, 50]],
                id: 5
            },
            {
                name: '正方形',
                color: '#ee6c9d',
                points: [[0, 0], [70, 0], [70, 70], [0, 70]],
                id: 6
            },
            {
                name: '平行四边形',
                color: '#c56cf0',
                points: [[0, 0], [100, 0], [130, 60], [30, 60]],
                id: 7
            }
        ];

        function resizeCanvas() {
            const container = canvas.parentElement;
            canvas.width = container.clientWidth;
            canvas.height = container.clientHeight;
            render();
        }

        function createSVG(piece) {
            const scale = 0.4;
            let points = piece.points.map(p => `${p[0] * scale},${p[1] * scale}`).join(' ');
            return `<svg width="${100 * scale}" height="${100 * scale}" viewBox="0 0 150 100">
                <polygon points="${points}" fill="${piece.color}" stroke="#fff" stroke-width="2"/>
            </svg>`;
        }

        function initPiecesPanel() {
            tangramPieces.forEach((piece, index) => {
                const div = document.createElement('div');
                div.className = 'piece-item';
                div.innerHTML = createSVG(piece);
                div.draggable = true;
                div.addEventListener('dragstart', (e) => {
                    e.dataTransfer.setData('text/plain', index);
                });
                piecesContainer.appendChild(div);
            });
        }

        function getTransformedPoints(piece) {
            const cx = piece.x;
            const cy = piece.y;
            const rad = piece.rotation * Math.PI / 180;
            const cos = Math.cos(rad);
            const sin = Math.sin(rad);

            return piece.points.map(p => {
                const x = p[0] - piece.centerX;
                const y = p[1] - piece.centerY;
                return {
                    x: cx + x * cos - y * sin,
                    y: cy + x * sin + y * cos
                };
            });
        }

        function drawPiece(piece) {
            const points = getTransformedPoints(piece);
            
            ctx.save();
            ctx.shadowColor = 'rgba(0,0,0,0.3)';
            ctx.shadowBlur = 10;
            ctx.shadowOffsetX = 3;
            ctx.shadowOffsetY = 3;
            
            ctx.beginPath();
            ctx.moveTo(points[0].x, points[0].y);
            points.slice(1).forEach(p => ctx.lineTo(p.x, p.y));
            ctx.closePath();
            
            ctx.fillStyle = piece.color;
            ctx.fill();
            ctx.strokeStyle = '#fff';
            ctx.lineWidth = 2;
            ctx.stroke();
            
            if (piece === selectedPiece) {
                ctx.strokeStyle = '#ffff00';
                ctx.lineWidth = 3;
                ctx.stroke();
            }
            
            ctx.restore();
        }

        function render() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            pieces.forEach(piece => drawPiece(piece));
        }

        function isPointInPiece(px, py, piece) {
            const points = getTransformedPoints(piece);
            let inside = false;
            for (let i = 0, j = points.length - 1; i < points.length; j = i++) {
                const xi = points[i].x, yi = points[i].y;
                const xj = points[j].x, yj = points[j].y;
                if (((yi > py) !== (yj > py)) && (px < (xj - xi) * (py - yi) / (yj - yi) + xi)) {
                    inside = !inside;
                }
            }
            return inside;
        }

        function getPieceCenter(piece) {
            const points = piece.points;
            let cx = 0, cy = 0;
            points.forEach(p => {
                cx += p[0];
                cy += p[1];
            });
            return {
                x: cx / points.length,
                y: cy / points.length
            };
        }

        function snapPieces() {
            let snapped = false;
            
            for (let i = 0; i < pieces.length; i++) {
                for (let j = i + 1; j < pieces.length; j++) {
                    const p1 = pieces[i];
                    const p2 = pieces[j];
                    
                    const points1 = getTransformedPoints(p1);
                    const points2 = getTransformedPoints(p2);
                    
                    for (let pt1 of points1) {
                        for (let pt2 of points2) {
                            const dist = Math.sqrt((pt1.x - pt2.x) ** 2 + (pt1.y - pt2.y) ** 2);
                            
                            if (dist < SNAP_DISTANCE && dist > 0) {
                                const dx = pt2.x - pt1.x;
                                const dy = pt2.y - pt1.y;
                                
                                p2.x += dx;
                                p2.y += dy;
                                snapped = true;
                            }
                        }
                    }
                }
            }
            
            if (snapped) {
                showSnappedIndicator();
            }
            
            return snapped;
        }

        function showSnappedIndicator() {
            snappedIndicator.classList.add('show');
            setTimeout(() => {
                snappedIndicator.classList.remove('show');
            }, 1000);
        }

        function showCollisionIndicator() {
            collisionIndicator.classList.add('show');
            setTimeout(() => {
                collisionIndicator.classList.remove('show');
            }, 1000);
        }

        function doPolygonsIntersect(a, b) {
            const polygons = [a, b];
            for (let i = 0; i < polygons.length; i++) {
                const polygon = polygons[i];
                for (let j = 0; j < polygon.length; j++) {
                    const k = (j + 1) % polygon.length;
                    const normal = { x: -(polygon[k].y - polygon[j].y), y: polygon[k].x - polygon[j].x };
                    let minA = Infinity, maxA = -Infinity;
                    for (const p of a) {
                        const projected = normal.x * p.x + normal.y * p.y;
                        minA = Math.min(minA, projected);
                        maxA = Math.max(maxA, projected);
                    }
                    let minB = Infinity, maxB = -Infinity;
                    for (const p of b) {
                        const projected = normal.x * p.x + normal.y * p.y;
                        minB = Math.min(minB, projected);
                        maxB = Math.max(maxB, projected);
                    }
                    if (maxA < minB || maxB < minA) return false;
                }
            }
            return true;
        }

        function checkCollision(piece, excludePiece = null) {
            const points = getTransformedPoints(piece);
            for (const other of pieces) {
                if (other === piece || other === excludePiece) continue;
                const otherPoints = getTransformedPoints(other);
                if (doPolygonsIntersect(points, otherPoints)) {
                    return true;
                }
            }
            return false;
        }

        canvas.addEventListener('mousedown', (e) => {
            const rect = canvas.getBoundingClientRect();
            const x = e.clientX - rect.left;
            const y = e.clientY - rect.top;
            
            for (let i = pieces.length - 1; i >= 0; i--) {
                if (isPointInPiece(x, y, pieces[i])) {
                    selectedPiece = pieces[i];
                    selectedPiece.prevX = selectedPiece.x;
                    selectedPiece.prevY = selectedPiece.y;
                    isDragging = true;
                    offsetX = x - selectedPiece.x;
                    offsetY = y - selectedPiece.y;
                    pieces.splice(i, 1);
                    pieces.push(selectedPiece);
                    render();
                    return;
                }
            }
            
            selectedPiece = null;
            render();
        });

        canvas.addEventListener('mousemove', (e) => {
            if (isDragging && selectedPiece) {
                const rect = canvas.getBoundingClientRect();
                selectedPiece.x = e.clientX - rect.left - offsetX;
                selectedPiece.y = e.clientY - rect.top - offsetY;
                render();
            }
        });

        canvas.addEventListener('mouseup', () => {
            if (isDragging && selectedPiece) {
                if (checkCollision(selectedPiece)) {
                    selectedPiece.x = selectedPiece.prevX;
                    selectedPiece.y = selectedPiece.prevY;
                    showCollisionIndicator();
                } else {
                    snapPieces();
                }
                render();
            }
            isDragging = false;
        });

        canvas.addEventListener('dblclick', (e) => {
            const rect = canvas.getBoundingClientRect();
            const x = e.clientX - rect.left;
            const y = e.clientY - rect.top;
            
            for (let i = pieces.length - 1; i >= 0; i--) {
                if (isPointInPiece(x, y, pieces[i])) {
                    const oldRotation = pieces[i].rotation;
                    pieces[i].rotation = (pieces[i].rotation + ROTATION_STEP) % 360;
                    if (checkCollision(pieces[i])) {
                        pieces[i].rotation = oldRotation;
                        showCollisionIndicator();
                    } else {
                        snapPieces();
                    }
                    render();
                    return;
                }
            }
        });

        canvas.addEventListener('dragover', (e) => {
            e.preventDefault();
        });

        canvas.addEventListener('drop', (e) => {
            e.preventDefault();
            const index = parseInt(e.dataTransfer.getData('text/plain'));
            const piece = tangramPieces[index];
            
            const rect = canvas.getBoundingClientRect();
            const center = getPieceCenter(piece);
            
            const newPiece = {
                ...piece,
                x: e.clientX - rect.left,
                y: e.clientY - rect.top,
                rotation: 0,
                centerX: center.x,
                centerY: center.y
            };
            
            if (checkCollision(newPiece)) {
                showCollisionIndicator();
                return;
            }
            
            pieces.push(newPiece);
            selectedPiece = newPiece;
            render();
        });

        function resetGame() {
            pieces = [];
            selectedPiece = null;
            render();
        }

        function clearCanvas() {
            resetGame();
        }

        window.addEventListener('resize', resizeCanvas);
        
        initPiecesPanel();
        resizeCanvas();
    </script>
</body>
</html>
